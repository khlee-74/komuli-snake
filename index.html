<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>꼬물이의 간식 여행 🐍</title>
<style>
  :root { --ink:#334155; --pink:#ffd7e5; --mint:#c9f4df; --cream:#fffaf0; --green:#65b98b; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; padding:22px 14px 34px;
    font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif;
    color:var(--ink); background:radial-gradient(circle at top left,#fff0f5,transparent 35%),
      linear-gradient(135deg,#f4fff8,#fffaf0);
    display:flex; justify-content:center; align-items:flex-start;
  }
  .app { width:min(100%,560px); text-align:center; }
  h1 { margin:4px 0 5px; font-size:clamp(1.7rem,5vw,2.4rem); }
  .subtitle { margin:0 0 17px; color:#64748b; }
  .stats { display:flex; justify-content:center; gap:10px; margin:0 auto 12px; }
  .stat { background:#fff; border:2px solid #f3e5ea; border-radius:16px; padding:8px 18px; min-width:112px; box-shadow:0 4px 0 #f2e8ec; }
  .stat small { display:block; color:#94a3b8; font-size:.76rem; }
  .stat strong { font-size:1.2rem; }
  .game-wrap { position:relative; padding:9px; background:#fff; border:3px solid #f4dce5; border-radius:23px; box-shadow:0 9px 0 #ead5dd; }
  canvas { display:block; width:100%; height:auto; border-radius:13px; background:#f1fff6; touch-action:none; }
  .overlay { position:absolute; inset:9px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; border-radius:13px; background:rgba(255,250,240,.88); padding:18px; }
  .overlay.hidden { display:none; }
  .mascot { font-size:3rem; line-height:1; }
  .overlay h2 { margin:0; font-size:1.5rem; }
  .overlay p { margin:0 0 5px; color:#64748b; line-height:1.5; }
  button { border:0; border-radius:14px; padding:11px 19px; font:inherit; font-weight:750; cursor:pointer; color:#fff; background:#58ad82; box-shadow:0 4px 0 #39845f; }
  button:active { transform:translateY(2px); box-shadow:0 2px 0 #39845f; }
  .secondary { background:#f3a8c0; box-shadow:0 4px 0 #d77d9c; }
  .help { margin:18px 0 8px; font-size:.92rem; color:#64748b; line-height:1.6; }
  .pad { display:grid; grid-template-columns:repeat(3,54px); grid-template-rows:repeat(2,48px); justify-content:center; gap:7px; margin:13px auto 0; }
  .pad button { padding:0; font-size:1.25rem; border-radius:13px; }
  .pad .up { grid-column:2; grid-row:1; }
  .pad .left { grid-column:1; grid-row:2; }
  .pad .down { grid-column:2; grid-row:2; }
  .pad .right { grid-column:3; grid-row:2; }
  .bottom { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:15px; }
  .bottom button { font-size:.92rem; }
  .tiny { font-size:.76rem; color:#94a3b8; margin-top:18px; }
  @media (min-width:600px) { .pad { display:none; } }
</style>
</head>
<body>
<main class="app">
  <h1>🐍 꼬물이의 간식 여행</h1>
  <p class="subtitle">사과를 먹고 쑥쑥 자라나는 꼬물이!</p>
  <div class="stats">
    <div class="stat"><small>오늘의 점수 🍎</small><strong id="score">0</strong></div>
    <div class="stat"><small>최고 기록 🏆</small><strong id="best">0</strong></div>
  </div>
  <div class="game-wrap">
    <canvas id="game" width="420" height="420" aria-label="스네이크 게임"></canvas>
    <div class="overlay" id="overlay">
      <div class="mascot" id="overlayEmoji">🐍</div>
      <h2 id="overlayTitle">꼬물이와 놀아볼까요?</h2>
      <p id="overlayText">사과를 먹으면 길어져요.<br>벽과 자기 몸은 조심해요!</p>
      <button id="startBtn">게임 시작하기 🍎</button>
    </div>
  </div>
  <div class="pad" aria-label="방향 조작">
    <button class="up" data-dir="up" aria-label="위">⬆️</button>
    <button class="left" data-dir="left" aria-label="왼쪽">⬅️</button>
    <button class="down" data-dir="down" aria-label="아래">⬇️</button>
    <button class="right" data-dir="right" aria-label="오른쪽">➡️</button>
  </div>
  <p class="help">💻 PC: 방향키 또는 WASD<br>📱 스마트폰: 화면 아래 화살표 버튼을 눌러요</p>
  <div class="bottom">
    <button class="secondary" id="pauseBtn">잠깐 쉬기 ⏸️</button>
    <button id="restartBtn">처음부터 다시 ↻</button>
  </div>
  <p class="tiny">꼬물이의 간식 여행 · 나만의 작은 게임 💚</p>
</main>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const titleEl = document.getElementById('overlayTitle');
  const textEl = document.getElementById('overlayText');
  const emojiEl = document.getElementById('overlayEmoji');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const SIZE = 21, CELL = 20, BOARD = SIZE * CELL;
  let snake, food, dir, nextDir, score, best, running=false, paused=false, ended=false, timer=null;
  try { best = Number(localStorage.getItem('komul_best') || 0); } catch(e) { best=0; }
  bestEl.textContent = best;

  function reset() {
    snake = [{x:7,y:10},{x:6,y:10},{x:5,y:10}];
    dir = {x:1,y:0}; nextDir = {x:1,y:0}; score=0;
    scoreEl.textContent=score; placeFood(); running=false; paused=false; ended=false;
    clearInterval(timer); timer=null; pauseBtn.textContent='잠깐 쉬기 ⏸️';
    draw(); showOverlay('🐍','꼬물이와 놀아볼까요?','사과를 먹으면 길어져요.<br>벽과 자기 몸은 조심해요!','게임 시작하기 🍎');
  }
  function placeFood() {
    do { food={x:Math.floor(Math.random()*SIZE),y:Math.floor(Math.random()*SIZE)}; }
    while(snake && snake.some(s=>s.x===food.x && s.y===food.y));
  }
  function showOverlay(emoji,title,message,button) {
    emojiEl.textContent=emoji; titleEl.textContent=title; textEl.innerHTML=message;
    startBtn.textContent=button; overlay.classList.remove('hidden');
  }
  function start() {
    if(ended) reset();
    overlay.classList.add('hidden'); running=true; paused=false;
    clearInterval(timer); timer=setInterval(step,125);
    pauseBtn.textContent='잠깐 쉬기 ⏸️';
  }
  function setDirection(name) {
    const map={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
    const d=map[name]; if(!d) return;
    if(d.x === -dir.x && d.y === -dir.y) return;
    nextDir=d;
    if(!running && !ended && overlay.classList.contains('hidden')===false) start();
  }
  function step() {
    if(!running || paused) return;
    dir=nextDir;
    const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
    const ate=head.x===food.x && head.y===food.y;
    const body=ate ? snake : snake.slice(0,-1);
    if(head.x<0||head.y<0||head.x>=SIZE||head.y>=SIZE||body.some(s=>s.x===head.x&&s.y===head.y)) {
      running=false; ended=true; clearInterval(timer); timer=null;
      showOverlay('🥺','앗, 부딪혔어요!','점수는 <b>'+score+'</b>점이에요.<br>한 번 더 도전해 볼까요?','다시 도전하기 🔁'); draw(); return;
    }
    snake.unshift(head);
    if(ate) {
      score+=10; scoreEl.textContent=score; placeFood();
      if(score>best) { best=score; bestEl.textContent=best; try{localStorage.setItem('komul_best',String(best));}catch(e){} }
    } else snake.pop();
    draw();
  }
  function draw() {
    ctx.clearRect(0,0,BOARD,BOARD);
    ctx.fillStyle='#f1fff6'; ctx.fillRect(0,0,BOARD,BOARD);
    ctx.strokeStyle='#e1f5e9'; ctx.lineWidth=1;
    for(let i=0;i<=SIZE;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,BOARD);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(BOARD,i*CELL);ctx.stroke();}
    // apple
    const fx=food.x*CELL+CELL/2, fy=food.y*CELL+CELL/2;
    ctx.font='17px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('🍎',fx,fy+1);
    // body
    snake.slice().reverse().forEach((s,i,arr)=>{
      const originalIndex=snake.length-1-i, x=s.x*CELL, y=s.y*CELL;
      ctx.fillStyle=originalIndex===0?'#39a96b':(originalIndex%2===0?'#79d6a0':'#63c98e');
      roundRect(x+1,y+1,CELL-2,CELL-2,7); ctx.fill();
    });
    // eyes on head, aligned with travel direction
    const h=snake[0], cx=h.x*CELL+CELL/2, cy=h.y*CELL+CELL/2;
    const perp={x:-dir.y,y:dir.x};
    for(const side of [-1,1]) {
      const ex=cx+dir.x*4+perp.x*4*side, ey=cy+dir.y*4+perp.y*4*side;
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(ex,ey,3,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#334155'; ctx.beginPath(); ctx.arc(ex+dir.x,ey+dir.y,1.5,0,Math.PI*2); ctx.fill();
    }
    // tiny smile
    ctx.strokeStyle='#286846'; ctx.lineWidth=1.4; ctx.beginPath();
    ctx.arc(cx+dir.x*5,cy+dir.y*5,3,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
  }
  function roundRect(x,y,w,h,r) {
    ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }
  document.addEventListener('keydown',e=>{
    const map={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};
    if(map[e.key]) {e.preventDefault(); setDirection(map[e.key]);}
    if(e.code==='Space'){e.preventDefault(); if(running){paused=!paused;pauseBtn.textContent=paused?'계속하기 ▶️':'잠깐 쉬기 ⏸️';}else start();}
  });
  document.querySelectorAll('[data-dir]').forEach(b=>{
    b.addEventListener('click',()=>setDirection(b.dataset.dir));
    b.addEventListener('touchstart',e=>{e.preventDefault();setDirection(b.dataset.dir);},{passive:false});
  });
  startBtn.addEventListener('click',start);
  pauseBtn.addEventListener('click',()=>{
    if(!running && !paused) return;
    paused=!paused;
    pauseBtn.textContent=paused?'계속하기 ▶️':'잠깐 쉬기 ⏸️';
  });
  document.getElementById('restartBtn').addEventListener('click',reset);
  // Keep the canvas crisp while fitting the screen.
  reset();
})();
</script>
</body>
</html>
